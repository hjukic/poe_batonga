[package]
name = "poe-batonga"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# Renders zone names in the game's own font to read the big map's exit labels (pure Rust).
fontdue = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader"] }
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }

# GTK input shape: while locked, only the header buttons take mouse input.
# Same major version as the gtk crate Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# v0_6: keyboard modes, margin getters, is_supported (needs system gtk-layer-shell >= 0.6).
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# Reads the character screens (identity_ocr.rs): PaddleOCR's models on ONNX Runtime, in
# process. The first build downloads ONNX Runtime's static library (about 30 MB linked in).
paddle-ocr-rs = "0.6.1"
# Pinned: paddle-ocr-rs 0.6.1 does not compile against later release candidates.
ort = { version = "=2.0.0-rc.10", default-features = false }
image = { version = "0.25", default-features = false }
# setpriority: the reading thread runs at the lowest CPU priority (identity_linux.rs).
libc = "0.2"

# The navigator's simulated walks run in every `cargo test`: unoptimised they take 90 s.
[profile.test]
opt-level = 1

# `npm run desktop` (tauri dev) is how the app is run day to day: the frame reader and the
# navigator are several times faster optimised. Dependencies stay as they are, so
# rebuilds stay short.
[profile.dev.package.poe-batonga]
opt-level = 2

# Reading the character screens on Linux (identity_ocr.rs): the image work around the text
# models is several times faster optimised, and these are built once.
[profile.dev.package.paddle-ocr-rs]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.imageproc]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
