[package]
name = "poe-batonga"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading"] }

# GTK input shape: while locked, only the header buttons take mouse input.
# Same major version as the gtk crate Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# v0_6: keyboard modes, margin getters, is_supported (needs system gtk-layer-shell >= 0.6).
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
